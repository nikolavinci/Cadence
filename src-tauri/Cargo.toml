[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_System_WinRT", "Foundation_Collections", "Win32_Graphics_Gdi", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D", "Win32_System_WinRT_Graphics_Capture", "Graphics_DirectX", "Foundation_Numerics", "Win32_Media_MediaFoundation"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
# whisper-rs = "0.11.1" # Requires LLVM/Clang on Windows
reqwest = { version = "0.12.5", features = ["stream"] }
cpal = "0.15.3"

